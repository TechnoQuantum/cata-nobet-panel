[package]
name = "nobet-panel"
version = "2.0.0"
edition = "2021"
description = "Windows desktop app that sends pharmacy duty rosters to iPIXEL-compatible BLE LED panels"
publish = false
build = "build.rs"

[[bin]]
name = "NobetPanel"
path = "src/main.rs"

[dependencies]
slint = "1.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crc32fast = "1"
gif = "0.13"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
ab_glyph = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
unicode-normalization = "0.1"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-service = "0.7"
windows = { version = "0.58", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.9"
embed-resource = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
